<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AmmaCare — Parent Chat + Caregiver Dashboard</title>
<style>
  body{font-family:system-ui,sans-serif;margin:0;background:#0b141a;color:#e9edef}
  header{padding:12px 16px;background:#202c33;font-weight:700}
  header small{font-weight:400;color:#8696a0}
  .wrap{display:grid;grid-template-columns:1fr 1fr;gap:0;min-height:92vh}
  @media(max-width:800px){.wrap{grid-template-columns:1fr}}
  .pane{padding:14px;border-right:1px solid #222d34}
  h3{margin:6px 0 10px;color:#00a884}
  #chat{background:#0b141a;border:1px solid #222d34;border-radius:8px;height:52vh;overflow:auto;padding:10px}
  .msg{max-width:80%;padding:8px 10px;border-radius:8px;margin:6px 0;white-space:pre-wrap}
  .parent{background:#005c4b;margin-left:auto}
  .agent{background:#202c33}
  .meta{font-size:11px;color:#8696a0;margin-top:2px}
  .row{display:flex;gap:8px;margin-top:10px}
  input[type=text]{flex:1;padding:10px;border-radius:6px;border:1px solid #2a3942;background:#202c33;color:#fff}
  button{padding:10px 14px;border:0;border-radius:6px;background:#00a884;color:#04241c;font-weight:700;cursor:pointer}
  button.cancel{background:#3b4a54;color:#e9edef}
  .card{background:#202c33;border-radius:8px;padding:10px;margin:8px 0}
  .alert{border:2px solid #ea0038}
  .pill{font-size:11px;background:#2a3942;padding:2px 8px;border-radius:99px}
  .samples button{background:#2a3942;color:#e9edef;font-weight:400;margin:2px}
</style>
</head>
<body>
<header>AmmaCare V1 <small>— Malayalam-first parent care agent (Maitri-like demo) · Parent: Kochi · Caregiver: Dubai</small></header>
<div class="wrap">
  <div class="pane">
    <h3>👵 Parent — WhatsApp-style chat</h3>
    <div id="chat"></div>
    <div class="row">
      <input id="inp" type="text" placeholder="Type as Amma… (Malayalam / Manglish / English)">
      <button onclick="send()">Send</button>
    </div>
    <div class="samples" style="margin-top:8px">
      <div class="meta">Tap a sample:</div>
      <button onclick="sample(this)">Amme, ente BP tablet theerarayi</button>
      <button onclick="sample(this)">Nale 10 manikku Dr. Sharma de clinicil pokanam, oru auto venam</button>
      <button onclick="sample(this)">Ravile tablet kazhichu, sugam aanu</button>
      <button onclick="sample(this)">Veetil veezhnu, sahayam venam</button>
    </div>
  </div>
  <div class="pane">
    <h3>📋 Caregiver dashboard</h3>
    <div id="alerts"></div>
    <h4>Tasks waiting for your approval</h4>
    <div id="tasks"></div>
    <h4>Today's medicine reminders</h4>
    <div id="reminders"></div>
    <h4>Weekly summary</h4>
    <div class="card" id="summary"></div>
    <button class="cancel" onclick="reset()">Reset demo data</button>
  </div>
</div>
<script>
const $=id=>document.getElementById(id);
async function refresh(){
  const s=await (await fetch('/api/state')).json();
  $('chat').innerHTML=s.messages.map(m=>`<div class="msg ${m.from==='parent'?'parent':'agent'}">${m.text}<div class="meta">${m.at}</div></div>`).join('');
  $('chat').scrollTop=1e9;
  $('alerts').innerHTML=s.alerts.map(a=>`<div class="card alert">🚨 <b>${a.title}</b><br>“${a.text}”<div class="meta">${a.at} — call parent, then local contact, then act. Not a substitute for 112.</div></div>`).join('');
  $('tasks').innerHTML=s.tasks.slice().reverse().map(t=>`<div class="card"><b>${t.title}</b> <span class="pill">${t.status}</span><div class="meta">${t.at} · intent: ${t.intent}<br>“${t.raw}”</div>${t.status==='pending_approval'?`<button onclick="decide(${t.id},'approve')">Approve</button> <button class="cancel" onclick="decide(${t.id},'cancel')">Cancel</button>`:''}</div>`).join('')||'<div class="meta">No tasks yet.</div>';
  $('reminders').innerHTML=s.reminders.map(r=>`<div class="card">💊 ${r.text}</div>`).join('');
  $('summary').textContent=s.summary;
}
async function send(){
  const v=$('inp').value.trim(); if(!v) return; $('inp').value='';
  await fetch('/api/message',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:v})});
  refresh();
}
function sample(b){$('inp').value=b.textContent;send();}
async function decide(id,decision){
  await fetch('/api/task/decision',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,decision})});
  refresh();
}
async function reset(){await fetch('/api/reset',{method:'POST'});refresh();}
$('inp').addEventListener('keydown',e=>{if(e.key==='Enter')send();});
refresh();
</script>
</body>
</html>
